# Requires: Docker Engine 23+ with NVIDIA Container Toolkit
# GPU auth:  set VLLM_API_KEY in a .env file or as an env var to enable API key auth
# Monitoring: docker compose --profile monitoring up

services:
  vllm-gemma4:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-gemma3-turboquant:latest
    container_name: vllm-gemma3-server

    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_TARGET_DEVICE=cuda
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/vllm
      # SM 12.0 (Blackwell/RTX 5090) with CUDA 12.8: bypass FlashInfer's
      # CUDA >= 12.9 requirement for SM 12.x by providing arch suffix directly.
      - FLASHINFER_CUDA_ARCH_LIST=12.0f
      # Disable FlashInfer JIT sampling: SM 12.0 requires CUDA >= 12.9 for nvcc
      # compilation. Use PyTorch-native top-p/k sampler instead (no quality loss).
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - HF_HOME=/cache
      - HF_TOKEN=${HF_TOKEN:-}
      # Model config — override these in a .env file
      - MODEL_PATH=/models/gemma-3-27b-it-awq
      - KV_CACHE_DTYPE=turboquant_k8v4
      - GPU_MEMORY_UTIL=0.85
      - MAX_MODEL_LEN=32768
      # Set VLLM_API_KEY to enable bearer-token auth; leave empty to disable
      - VLLM_API_KEY=${VLLM_API_KEY:-}

    ports:
      - "8000:8000"

    volumes:
      - ./models:/models
      - ./cache:/cache
      - ./logs:/logs
      - ../config:/app/config:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    command: ["--max-num-batched-tokens", "4096"]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  prometheus:
    image: prom/prometheus:latest
    container_name: vllm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    depends_on:
      - vllm-gemma4
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: vllm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: vllm-network
