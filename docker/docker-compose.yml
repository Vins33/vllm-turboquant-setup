version: '3.8'

services:
  vllm-gemma4:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-gemma4-turboquant:latest
    container_name: vllm-gemma4-server
    
    # GPU support
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_TARGET_DEVICE=cuda
      - VLLM_USE_PRECOMPILED=0
      - VLLM_MAIN_CUDA_VERSION=12.8
      - PYTHONUNBUFFERED=1
      - HF_HOME=/cache
    
    # Ports
    ports:
      - "8000:8000"
    
    # Volumes for models and cache
    volumes:
      # Model directory (required)
      - ./models:/models:ro
      
      # HuggingFace cache (optional, for new model downloads)
      - ./cache:/cache
      
      # Logs
      - ./logs:/logs
      
      # Your custom configs (optional)
      - ./config:/app/config:ro
    
    # Resource limits
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=vllm-gemma4"
    
    # Additional arguments (override in compose override file)
    command: >
      --model /models/gemma4-27b-int8
      --quantization turboquant
      --kv-cache-dtype turboquant35
      --turboquant-metadata-path /models/gemma4-27b-int8/turboquant_kv.json
      --attention-backend TRITON_ATTN
      --gpu-memory-utilization 0.85
      --max-model-len 4096
      --dtype float16
      --api-key sk-proj-turboquant-5090

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vllm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    depends_on:
      - vllm-gemma4
    profiles:
      - monitoring

  # Optional: Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: vllm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: vllm-network
